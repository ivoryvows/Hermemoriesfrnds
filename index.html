
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123f3b">
  <title>Her Memories — Share Your Memories</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --teal: #123f3b;
      --teal-light: #1d5b53;
      --gold: #c9a96e;
      --gold-light: #ead9b5;
      --cream: #fbf8f1;
      --ink: #263b37;
      --muted: #71817b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(201,169,110,.16), transparent 34%),
        radial-gradient(circle at 90% 85%, rgba(29,91,83,.14), transparent 38%),
        var(--cream);
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 34px 25px;
      border: 1px solid var(--gold-light);
      border-radius: 24px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 55px rgba(18,63,59,.10);
    }

    .ornament {
      color: var(--gold);
      font-size: 22px;
      letter-spacing: 8px;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      color: var(--teal);
      font: 500 32px/1.2 'Playfair Display', serif;
    }

    .subtitle {
      margin: 13px 0 28px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 21px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 9px;
      color: var(--teal);
      font-size: 13px;
      font-weight: 500;
    }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid #d9dfd8;
      border-radius: 12px;
      padding: 14px;
      background: #fdfcf8;
      color: var(--ink);
      font: 13px 'Poppins', sans-serif;
      outline: none;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,169,110,.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .upload-box {
      padding: 19px 14px;
      border: 1px dashed var(--gold);
      border-radius: 14px;
      background: #fbfaf5;
      text-align: center;
    }

    .upload-icon {
      color: var(--gold);
      font-size: 27px;
      margin-bottom: 5px;
    }

    .upload-box p {
      margin: 4px 0 12px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    input[type="file"] {
      width: 100%;
      color: var(--muted);
      font: 11px 'Poppins', sans-serif;
    }

    input[type="file"]::file-selector-button {
      border: 0;
      border-radius: 20px;
      padding: 9px 13px;
      margin-right: 8px;
      background: var(--teal);
      color: white;
      font: 11px 'Poppins', sans-serif;
      cursor: pointer;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 13px;
    }

    .preview-grid img {
      width: 100%;
      height: 88px;
      object-fit: cover;
      border-radius: 9px;
      border: 1px solid var(--gold-light);
    }

    .count {
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
    }

    .submit-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      background: linear-gradient(135deg, var(--teal-light), var(--teal));
      color: white;
      font: 500 14px 'Poppins', sans-serif;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(18,63,59,.17);
      transition: transform .2s, opacity .2s;
    }

    .submit-btn:hover { transform: translateY(-2px); }
    .submit-btn:disabled { opacity: .6; cursor: wait; transform: none; }

    .status {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
    }

    .status.success {
      display: block;
      color: #245d43;
      background: #edf7ef;
    }

    .status.error {
      display: block;
      color: #9b3030;
      background: #fff0ed;
    }

    .footer {
      margin-top: 23px;
      color: #9a9d91;
      font: italic 12px 'Playfair Display', serif;
    }

    @media (max-width: 380px) {
      .container { padding: 28px 18px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="ornament">✦ ✧ ✦</div>
    <h1>Her Memories</h1>

    <div class="subtitle">
      Thank you for being part of this special celebration.
      Share your beautiful wishes and the moments you captured.
      Every memory means so much. ♡
    </div>

    <form id="memoryForm">
      <div class="field">
        <label for="guestName">Your Name / Family Name</label>
        <input
          type="text"
          id="guestName"
          maxlength="80"
          placeholder="e.g. Chloe or Mom & Dad"
          required
        >
      </div>

      <div class="field">
        <label for="guestMessage">Your Wishes / Message</label>
        <textarea
          id="guestMessage"
          maxlength="1000"
          placeholder="Write your heartfelt wishes here..."
        ></textarea>
      </div>

      <div class="field">
        <label for="guestImages">Upload 3 Pictures</label>
        <div class="upload-box">
          <div class="upload-icon">♡</div>
          <p>Select up to 3 favourite pictures<br>JPG, PNG or other image formats</p>
          <input
            type="file"
            id="guestImages"
            accept="image/*"
            multiple
          >
          <div class="count" id="imageCount">0 of 3 pictures selected</div>
          <div class="preview-grid" id="previewGrid"></div>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        Share Your Memory ✨
      </button>

      <div class="status" id="statusMessage" role="status"></div>
    </form>

    <div class="footer">Made with love · Her Memories</div>
  </main>

  <script>
    // Her Memories Firebase project
    const firebaseConfig = {
      apiKey: "AIzaSyDSnrEvqQuPIyL_8Iz7qTWhIabxOJY5vQ",
      authDomain: "her-memories-ff80a.firebaseapp.com",
      projectId: "her-memories-ff80a",
      storageBucket: "her-memories-ff80a.firebasestorage.app",
      messagingSenderId: "31457647914",
      appId: "1:31457647914:web:415bc0e5238f290cd95253",
      measurementId: "G-G4X5VTKH6Z"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById("memoryForm");
    const imageInput = document.getElementById("guestImages");
    const previewGrid = document.getElementById("previewGrid");
    const imageCount = document.getElementById("imageCount");
    const submitBtn = document.getElementById("submitBtn");
    const statusMessage = document.getElementById("statusMessage");

    let selectedFiles = [];

    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status " + type;
    }

    imageInput.addEventListener("change", () => {
      const files = Array.from(imageInput.files || []);

      if (files.length > 3) {
        imageInput.value = "";
        selectedFiles = [];
        previewGrid.innerHTML = "";
        imageCount.textContent = "0 of 3 pictures selected";
        showStatus("Please select a maximum of 3 pictures.", "error");
        return;
      }

      selectedFiles = files;
      previewGrid.innerHTML = "";

      selectedFiles.forEach(file => {
        if (!file.type.startsWith("image/")) return;

        const img = document.createElement("img");
        const objectUrl = URL.createObjectURL(file);
        img.src = objectUrl;
        img.alt = "Selected picture";
        img.onload = () => URL.revokeObjectURL(objectUrl);
        previewGrid.appendChild(img);
      });

      imageCount.textContent = selectedFiles.length + " of 3 pictures selected";
      statusMessage.className = "status";
    });

    // Resize and compress each image before saving it.
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onerror = () => reject(new Error("Could not read one of your pictures."));

        reader.onload = event => {
          const img = new Image();

          img.onerror = () => reject(new Error("One of your pictures could not be opened."));

          img.onload = () => {
            const maxSide = 700;
            let width = img.width;
            let height = img.height;

            if (width > height && width > maxSide) {
              height = Math.round(height * maxSide / width);
              width = maxSide;
            } else if (height >= width && height > maxSide) {
              width = Math.round(width * maxSide / height);
              height = maxSide;
            }

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL("image/jpeg", 0.50));
          };

          img.src = event.target.result;
        };

        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const name = document.getElementById("guestName").value.trim();
      const message = document.getElementById("guestMessage").value.trim();

      if (!name) {
        showStatus("Please enter your name.", "error");
        return;
      }

      if (selectedFiles.length > 3) {
        showStatus("You can upload a maximum of 3 pictures.", "error");
        return;
      }

      if (selectedFiles.some(file => !file.type.startsWith("image/"))) {
        showStatus("Please select image files only.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving your memory... Please wait";
      statusMessage.className = "status";

      try {
        const imageData = [];

        for (const file of selectedFiles) {
          const compressed = await compressImage(file);
          imageData.push(compressed);
        }

        // Keep the document comfortably below Firestore's 1 MiB limit.
        const totalImageCharacters = imageData.reduce(
          (total, image) => total + image.length, 0
        );

        if (totalImageCharacters > 800000) {
          throw new Error(
            "Your pictures are too large together. Please choose smaller pictures or fewer pictures and try again."
          );
        }

        await db.collection("brideToBeMemories").add({
          name: name,
          message: message,
          images: imageData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        form.reset();
        selectedFiles = [];
        previewGrid.innerHTML = "";
        imageCount.textContent = "0 of 3 pictures selected";

        showStatus(
          "Thank you! Your memory has been shared successfully. ♡",
          "success"
        );

      } catch (error) {
        console.error("Memory submission error:", error);
        showStatus(
          error.message || "Something went wrong. Please try again.",
          "error"
        );
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Share Your Memory ✨";
      }
    });
  </script>
</body>
</html>
